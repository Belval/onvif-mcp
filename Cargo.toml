[package]
name = "onvif-sight"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Low-latency ONVIF camera MCP with persistent RTSP and latest-frame buffers"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dotenvy = "0.15"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
imageproc = { version = "0.27", default-features = false }
nalgebra = "0.35"
openh264 = "0.9"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
retina = "0.4.21"
rmcp = { version = "3.8", features = ["transport-io", "client", "transport-child-process"] }
roxmltree = "0.21"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-std", "signal"] }
url = "2"
tower = { version = "0.5", default-features = false }
turbojpeg = "1.5.1"
fast_image_resize = { version = "6.1.0", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
