<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="960" viewBox="0 0 1520 960" role="img" aria-labelledby="title desc">
<title id="title">A stream that stays open.</title>
<desc id="desc">A persistent video stream feeds the agent through a latest-frame buffer. The agent aims through a calibrated controller that moves the camera and verifies a fresh frame.</desc>
<rect width="100%" height="100%" fill="#F5F3EC"/>
<rect x="48" y="200" width="1424" height="220" rx="6" fill="#303D2C"/>
<text x="48" y="32" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="22" font-weight="400" fill="#626959">01 / CAMERA PIPELINE</text>
<text x="48" y="78" dominant-baseline="text-before-edge" text-anchor="start" font-family="Georgia, Times New Roman, DejaVu Serif, serif" font-size="64" font-weight="400" fill="#303D2C">A stream that stays open.</text>
<rect x="48" y="480" width="326" height="168" rx="6" fill="#F5F3EC" stroke="#D8DBCF" stroke-width="3"/>
<text x="211.0" y="529.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#303D2C">C210 camera</text>
<text x="211.0" y="569.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#626959">H.264 / RTSP</text>
<rect x="414" y="480" width="326" height="168" rx="6" fill="#F5F3EC" stroke="#D8DBCF" stroke-width="3"/>
<text x="577.0" y="509.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#303D2C">Native codecs</text>
<text x="577.0" y="549.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#626959">OpenH264</text>
<text x="577.0" y="589.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#626959">TurboJPEG</text>
<rect x="780" y="480" width="326" height="168" rx="6" fill="#F5F3EC" stroke="#D8DBCF" stroke-width="3"/>
<text x="943.0" y="529.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#303D2C">Latest-frame buffer</text>
<text x="943.0" y="569.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#626959">Newest frame only</text>
<rect x="1146" y="480" width="326" height="168" rx="6" fill="#F5F3EC" stroke="#D8DBCF" stroke-width="3"/>
<text x="1309.0" y="529.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#303D2C">Agent</text>
<text x="1309.0" y="569.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#626959">Snapshot / scan</text>
<rect x="510" y="710" width="500" height="168" rx="6" fill="#E6E9DC" stroke="#D8DBCF" stroke-width="3"/>
<text x="760.0" y="739.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#303D2C">Calibrated ONVIF</text>
<text x="760.0" y="779.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#626959">Move → arrival reports</text>
<text x="760.0" y="819.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#626959">Fresh frame → verify</text>
<polyline points="374,564.0 414,564.0" fill="none" stroke="#284944" stroke-width="3"/>
<polygon points="414,564.0 400.143593539449,572.0 400.143593539449,556.0" fill="#284944"/>
<polyline points="740,564.0 780,564.0" fill="none" stroke="#284944" stroke-width="3"/>
<polygon points="780,564.0 766.143593539449,572.0 766.143593539449,556.0" fill="#284944"/>
<polyline points="1106,564.0 1146,564.0" fill="none" stroke="#284944" stroke-width="3"/>
<polygon points="1146,564.0 1132.143593539449,572.0 1132.143593539449,556.0" fill="#284944"/>
<polyline points="1309.0,648 1309,794 1010,794.0" fill="none" stroke="#284944" stroke-width="3" stroke-dasharray="12 8"/>
<polygon points="1010,794.0 1023.856406460551,786.0 1023.856406460551,802.0" fill="#284944"/>
<polyline points="510,794.0 211,794 211.0,648" fill="none" stroke="#284944" stroke-width="3" stroke-dasharray="12 8"/>
<polygon points="211.0,648 219.0,661.856406460551 203.0,661.856406460551" fill="#284944"/>
<text x="760.0" y="910" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" font-weight="400" fill="#626959">Two arrival reports · 15 ms polling · 50 ms settling · a fresh image</text>
<text x="100" y="222" dominant-baseline="text-before-edge" text-anchor="start" font-family="Georgia, Times New Roman, DejaVu Serif, serif" font-size="108" font-weight="400" fill="#F5F3EC">~2 ms</text>
<text x="108" y="356" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#F5F3EC">warm MCP preview</text>
<text x="640" y="247" dominant-baseline="text-before-edge" text-anchor="start" font-family="Georgia, Times New Roman, DejaVu Serif, serif" font-size="40" font-weight="400" fill="#F5F3EC">Connection cost, paid once.</text>
<text x="644" y="313" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#F5F3EC">Persistent RTSP. Native codecs. No frame queue.</text>
<text x="644" y="364" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" font-weight="400" fill="#F5F3EC">Earlier: ~2.5 s reopening RTSP for each capture.</text>
</svg>
