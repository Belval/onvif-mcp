[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onvif-sight-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["mcp>=1.12,<2", "onvif-zeep>=0.2.12", "Pillow>=10", "python-dotenv>=1", "av>=14"]

[project.scripts]
onvif-sight = "camera_mcp:main"

[tool.setuptools]
py-modules = ["camera_mcp"]
